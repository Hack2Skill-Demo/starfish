<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starfish · Sign in</title>
<!-- Static export of the Starfish design canvas. Designed, not built: every value on this page is illustrative. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fafafa}
a{color:#b63512}a:hover{color:#902d15}
button{font-family:inherit}
input::placeholder{color:#71717a}
</style>
</head>
<body>
<div style="min-height: 100vh; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 32px 16px; background: rgb(250, 250, 250); font-family: &quot;Plus Jakarta Sans&quot;, ui-sans-serif, system-ui, sans-serif; color: rgb(24, 24, 27); -webkit-font-smoothing: antialiased;">
  <div style="width: 100%; max-width: 28rem; box-sizing: border-box; border: 1px solid rgb(228, 228, 231); border-radius: 12px; background: rgb(255, 255, 255); padding: 32px; box-shadow: rgba(0, 0, 0, 0.08) 0px 10px 15px -3px, rgba(0, 0, 0, 0.06) 0px 4px 6px -4px;">
    <div style="margin-bottom: 32px; display: flex; justify-content: center;">
      <h1 style="margin: 0px; display: inline-flex; align-items: center; gap: 12px;">
        <svg width="56" height="56" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#f25c2f"></circle><path d="M50 18 58.8 38.4 80.4 40.1 64 54.4 69 75.6 50 64.2 31 75.6 36 54.4 19.6 40.1 41.2 38.4Z" fill="#fff4ef"></path></svg>
        <span style="font-family: &quot;Bricolage Grotesque&quot;, &quot;Plus Jakarta Sans&quot;, sans-serif; font-size: 24px; font-weight: 700; color: rgb(24, 24, 27);">Starfish</span>
      </h1>
    </div>

    

    <form style="display: flex; flex-direction: column; gap: 20px;">
      <div>
        <label for="email" style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: rgb(63, 63, 70);">Email</label>
        <input id="email" type="email" autocomplete="email" value="operator@example.com" style="height: 44px; width: 100%; box-sizing: border-box; border: 1px solid rgb(228, 228, 231); border-radius: 8px; background: transparent; padding: 0px 16px; font-family: inherit; font-size: 14px; color: rgb(24, 24, 27);">
      </div>
      <div>
        <label for="password" style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: rgb(63, 63, 70);">Password</label>
        <div style="position: relative;">
          <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" style="height: 44px; width: 100%; box-sizing: border-box; border: 1px solid rgb(228, 228, 231); border-radius: 8px; background: transparent; padding: 0px 48px 0px 16px; font-family: inherit; font-size: 14px; color: rgb(24, 24, 27);">
          <button type="button" aria-label="Show password" style="position: absolute; right: 2px; top: 0px; width: 44px; height: 44px; border: 0px; background: none; color: rgb(113, 113, 122); display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>
      
      
        <a href="Overview.html" style="height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: rgb(182, 53, 18); font-size: 14px; font-weight: 500; color: rgb(255, 255, 255); text-decoration: none;">Sign In</a>
      
    </form>
  </div></div>
</body>
</html>

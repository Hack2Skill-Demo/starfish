version: 2

# Minor/patch npm bumps are grouped into one PR per
# group and auto-merged on green by .github/workflows/dependabot-automerge.yml;
# majors open individually for a deliberate review. GitHub Actions bumps are
# never auto-merged (#301).
#
# `cooldown` (#301): Dependabot proposes a release only once it is 7 days old, in
# every ecosystem. A hijacked or broken release is usually found and pulled within
# days; this keeps it from reaching an auto-merged PR, and through deploy-on-merge
# a deploy. A security update is not delayed by it.
#
# `labels: []`: Dependabot only applies labels that already exist in the repo, and
# a missing one makes it post a config-error comment on every PR it opens. Nothing
# reads labels (the auto-merge workflow keys off the PR author), so none are set.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels: []
    groups:
      production-deps:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-deps:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # Actions are pinned to full commit SHAs, so they never move on their own;
  # this keeps them current via PRs that bump the SHA and its version comment.
  # A person merges each one.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: []

name: Deploy web UI

# Runs scripts/deploy-web.sh from Actions, so the judges' link (#12) can be redeployed by a teammate with no
# local `firebase login` (#92), the same way the engine can (deploy.yml, #75). One-time setup:
# docs/deploy.md ("Deploy the web UI from GitHub Actions").
#
# Decisions, on purpose (the same as the engine's; neither is made here beyond following #75):
#   - Started by hand (workflow_dispatch), and, when a person turns it on, by a push to main that changes
#     the UI (the paths below). Off until the repository variable STARFISH_DEPLOY_ON_MERGE is `true`:
#     with it on, whoever can merge to main changes what judges see. The `deploy` environment's required
#     reviewers keep a person in that loop.
#   - The job runs in the `deploy` environment, the one the Workload Identity provider accepts
#     (docs/deploy.md), so that environment's protection rules are the gate. Do not rename it.
#   - No service-account key and no GitHub secret: the job swaps its OIDC token for short-lived credentials,
#     and the Firebase CLI reads them as Application Default Credentials. That last step has NOT been run.
#   - Everything deployment-specific is a repository variable; this file names none.
#   - The environment label the page shows is STARFISH_ENV (it must be `demo` for the public page to show its
#     data to guests). Anonymous sign-in is NOT turned on here: it is project-wide, a decision for a person.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '!web/**/*.test.ts'
      - '!web/**/*.test.tsx'
      - 'src/settingsSchema.ts'
      - 'src/triageRules.ts'
      - 'src/oncallSchema.ts'
      - 'src/agentRunRecord.ts'
      - 'src/ingestLag.ts'
      - 'src/handoff.ts'
      - 'src/incidentActions.ts'
      - 'firebase.json'
      - 'scripts/deploy-web.sh'
      - 'scripts/wait-for-engine-deploy.sh'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the plan and change nothing (the build is printed, not run); two read-only gcloud calls check the Workload Identity sign-in
        type: boolean
        default: false

# One web deploy at a time, and never cancel one halfway.
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # A hand-started run always goes ahead; a push only when deploy-on-merge has been turned on.
    if: github.event_name == 'workflow_dispatch' || vars.STARFISH_DEPLOY_ON_MERGE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: deploy
    # `id-token: write` lets this job ask GitHub for the OIDC token Google exchanges. Granted to this job only.
    # `actions: read` is for the wait step below (it lists this commit's Deploy engine run), nothing else.
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the repository variables
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          STARFISH_GCP_PROJECT_ID: ${{ vars.STARFISH_GCP_PROJECT_ID }}
        run: |
          missing=0
          for name in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT STARFISH_GCP_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set (docs/deploy.md, 'Deploy the web UI from GitHub Actions')"
              missing=1
            fi
          done
          exit "$missing"

      - name: Enable pnpm
        run: corepack enable pnpm

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'

      # The script builds the UI, so unlike the engine deploy this one needs the repository's dependencies.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # gcloud for the check below, and for the script's own calls (linking a site to its web app, the uptime check).
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # In a dry run the script's reads fail open (a read it cannot make is planned as "missing"), and the auth step above
      # only writes a credentials file, so neither shows that the sign-in works. These two read-only calls do, and fail
      # the run when it does not: Google exchanges this job's OIDC token at the Workload Identity provider (this
      # repository, the `deploy` environment), the deployer account is impersonated, and that account reads the project
      # and its own account. Nothing else is checked: not the roles the deploy itself needs. Never run.
      - name: Check the sign-in (dry run only)
        if: inputs.dry_run
        env:
          PROJECT_ID: ${{ vars.STARFISH_GCP_PROJECT_ID }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          gcloud projects describe "$PROJECT_ID" --format='value(projectId)'
          gcloud iam service-accounts describe "$GCP_DEPLOY_SERVICE_ACCOUNT" --project="$PROJECT_ID" --format='value(email)'

      # A push that changes firestore.rules and the UI starts this workflow and Deploy engine together, and the engine
      # deploy is what publishes the rules the check below compares (#373). So on a push, wait (bounded) for the engine's
      # run on this same commit. It only orders the two and never fails the job: the rules check below stays the gate.
      # Only the read-only token is given to this step, never to the deploy.
      - name: Wait for the engine deploy of this push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: scripts/wait-for-engine-deploy.sh

      # Values reach the script through the environment, never by interpolation into the shell text.
      # An unset variable is an empty string, which the script treats as "use my default".
      # Before it builds, the script compares the live Firestore rules of the Starfish database with firestore.rules and
      # stops when they differ or cannot be read (#262): run Deploy engine first, which publishes the rules and indexes,
      # then this. ALLOW_RULES_DRIFT is deliberately not passed, so a run from here cannot skip that check.
      # The step before waits for the engine deploy of the same push, so the two need not be run in order by hand (#373).
      # (Its dry run prints the check and does not make it.)
      - name: Deploy
        env:
          PROJECT_ID: ${{ vars.STARFISH_GCP_PROJECT_ID }}
          HOSTING_SITE: ${{ vars.STARFISH_WEB_HOSTING_SITE }}
          STARFISH_ENV: ${{ vars.STARFISH_ENV }}
          STARFISH_DATABASE_ID: ${{ vars.STARFISH_DATABASE_ID }}
          # Optional (#12): empty = App Check off. A public site key, not a secret.
          VITE_STARFISH_APPCHECK_SITE_KEY: ${{ vars.STARFISH_WEB_APPCHECK_SITE_KEY }}
          # Optional (#230): the admin API's URL (the https://...run.app deploy-gcp.sh prints), which shows an admin "Run
          # ingest now" and "Retire"; empty = those controls are hidden. And when the engine line calls a run stopped
          # (minutes; empty = 90).
          VITE_STARFISH_ADMIN_API_URL: ${{ vars.STARFISH_WEB_ADMIN_API_URL }}
          VITE_STARFISH_STALE_MINUTES: ${{ vars.STARFISH_WEB_STALE_MINUTES }}
          # Optional, the public demo only: where a visitor finds the sign-in details, shown on the sign-in page and in
          # the welcome guide (never the credentials: it ships in the bundle). Empty = a generic line.
          VITE_STARFISH_DEMO_SIGNIN_HINT: ${{ vars.STARFISH_WEB_DEMO_SIGNIN_HINT }}
          # Optional, the public demo only: the watched demo app's Lab (an https URL), linked from the Incidents page.
          # Empty = no link; delete the variable and re-run this workflow to take the link down.
          VITE_STARFISH_DEMO_APP_URL: ${{ vars.STARFISH_WEB_DEMO_APP_URL }}
          # Optional, the public demo only: the source repository (an https URL), shown as a GitHub mark. Empty = no link.
          VITE_STARFISH_SOURCE_URL: ${{ vars.STARFISH_WEB_SOURCE_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: scripts/deploy-web.sh
